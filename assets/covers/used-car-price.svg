    <path d="M880 172h230" stroke="#ffffff" stroke-opacity=".18"/>
    <g font-family="monospace">
      <text x="908" y="212" fill="#e9b454" font-size="14">01</text>
      <text x="952" y="212" fill="#eceff3" font-size="14">clean</text>
      <text x="908" y="256" fill="#e9b454" font-size="14">02</text>
      <text x="952" y="256" fill="#eceff3" font-size="14">encode</text>
      <text x="908" y="300" fill="#e9b454" font-size="14">03</text>
      <text x="952" y="300" fill="#eceff3" font-size="14">split</text>
      <text x="908" y="344" fill="#e9b454" font-size="14">04</text>
