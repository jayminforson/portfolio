<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="64-bit CPU datapath block diagram">
  <rect width="1200" height="675" fill="#0d1116"/>
  <g stroke="#ffffff" stroke-opacity=".055">
    <path d="M0 84h1200M0 168h1200M0 252h1200M0 336h1200M0 420h1200M0 504h1200M0 588h1200"/>
    <path d="M100 0v675M200 0v675M300 0v675M400 0v675M500 0v675M600 0v675M700 0v675M800 0v675M900 0v675M1000 0v675M1100 0v675"/>
  </g>
  <!-- outer cpu boundary -->
  <rect x="70" y="120" width="1060" height="440" rx="10" fill="none" stroke="#e9b454" stroke-opacity=".45" stroke-dasharray="10 8"/>
  <text x="90" y="150" fill="#e9b454" font-family="monospace" font-size="13" letter-spacing="3">64-BIT PROCESSOR</text>

  <!-- blocks -->
  <g>
    <rect x="110" y="196" width="210" height="88" rx="6" fill="#161c23" stroke="#ffffff" stroke-opacity=".3"/>
    <text x="215" y="238" fill="#eceff3" font-family="monospace" font-size="16" text-anchor="middle">IF / PC</text>
    <text x="215" y="264" fill="#98a2b0" font-family="monospace" font-size="12" text-anchor="middle">instruction fetch</text>

    <rect x="110" y="344" width="210" height="88" rx="6" fill="#161c23" stroke="#ffffff" stroke-opacity=".3"/>
    <text x="215" y="386" fill="#eceff3" font-family="monospace" font-size="16" text-anchor="middle">INSTRUCTION MEM</text>
    <text x="215" y="412" fill="#98a2b0" font-family="monospace" font-size="12" text-anchor="middle">64-bit words</text>

    <rect x="410" y="270" width="220" height="88" rx="6" fill="#161c23" stroke="#e9b454" stroke-opacity=".8"/>
    <text x="520" y="312" fill="#e9b454" font-family="monospace" font-size="16" text-anchor="middle">CONTROL UNIT</text>
    <text x="520" y="338" fill="#98a2b0" font-family="monospace" font-size="12" text-anchor="middle">decode + schedule</text>

    <rect x="730" y="196" width="220" height="88" rx="6" fill="#161c23" stroke="#ffffff" stroke-opacity=".3"/>
    <text x="840" y="238" fill="#eceff3" font-family="monospace" font-size="16" text-anchor="middle">REGISTER FILE</text>
    <text x="840" y="264" fill="#98a2b0" font-family="monospace" font-size="12" text-anchor="middle">32 x 64-bit</text>

    <rect x="730" y="344" width="220" height="88" rx="6" fill="#161c23" stroke="#ffffff" stroke-opacity=".3"/>
    <text x="840" y="386" fill="#eceff3" font-family="monospace" font-size="16" text-anchor="middle">ALU</text>
    <text x="840" y="412" fill="#98a2b0" font-family="monospace" font-size="12" text-anchor="middle">arithmetic + logic</text>

    <rect x="410" y="452" width="220" height="76" rx="6" fill="#161c23" stroke="#ffffff" stroke-opacity=".3"/>
    <text x="520" y="486" fill="#eceff3" font-family="monospace" font-size="15" text-anchor="middle">DATA MEMORY</text>
    <text x="520" y="510" fill="#98a2b0" font-family="monospace" font-size="12" text-anchor="middle">load / store</text>

    <rect x="410" y="196" width="220" height="56" rx="6" fill="#161c23" stroke="#ffffff" stroke-opacity=".3"/>
    <text x="520" y="230" fill="#eceff3" font-family="monospace" font-size="15" text-anchor="middle">PIPELINE REGS</text>
  </g>

  <!-- buses -->
  <g fill="none" stroke-width="2">
    <path d="M320 240h90" stroke="#ffffff" stroke-opacity=".5"/>
    <path d="M320 388h60v-60h30" stroke="#ffffff" stroke-opacity=".5"/>
    <path d="M630 300h100" stroke="#e9b454" stroke-opacity=".85"/>
    <path d="M630 356h100" stroke="#e9b454" stroke-opacity=".85"/>
    <path d="M840 284v60" stroke="#ffffff" stroke-opacity=".5"/>
    <path d="M520 358v94" stroke="#ffffff" stroke-opacity=".5" stroke-dasharray="7 7"/>
    <path d="M520 284v-32" stroke="#ffffff" stroke-opacity=".4"/>
  </g>
  <g fill="#e9b454">
    <path d="M410 240l-10-5v10z"/><path d="M730 300l-10-5v10z"/><path d="M730 356l-10-5v10z"/>
  </g>
  <!-- data bus label -->
  <text x="1000" y="344" fill="#e9b454" font-family="monospace" font-size="13" letter-spacing="2">64-BIT</text>
  <text x="1000" y="366" fill="#e9b454" font-family="monospace" font-size="13" letter-spacing="2">BUS</text>
  <path d="M960 340h30" stroke="#e9b454" stroke-width="2"/>
  <path d="M960 362h30" stroke="#e9b454" stroke-width="2"/>
  <text x="90" y="614" fill="#e9b454" font-family="monospace" font-size="14" letter-spacing="3">DATAPATH / HIGH-LEVEL BLOCK VIEW</text>
</svg>
